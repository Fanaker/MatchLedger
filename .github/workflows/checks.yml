name: MatchLedger checks
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend packages
        run: pip install -r backend/requirements-dev.txt
      - name: Run reconciliation and API tests
        working-directory: backend
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile frontend and check JavaScript syntax
        working-directory: frontend
        run: npm run check
